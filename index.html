<body>
<canvas id="c"></canvas>
<div id="rot"><b>↻</b>Vend telefonen på langs</div>
<script>
(()=>{
'use strict';
const VERSION='0.3';
const HALL_URL='https://seranodk.github.io/';
const W=844,H=390,OUT='#2b2140';
const FONT='"Arial Rounded MT Bold","Trebuchet MS","DejaVu Sans",Arial,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),rot=document.getElementById('rot');
let SC=1,OX=0,OY=0,DPR=1;
function resize(){const w=innerWidth,h=innerHeight;DPR=Math.min(devicePixelRatio||1,2.5);cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';SC=Math.min(w/W,h/H);OX=(w-W*SC)/2;OY=(h-H*SC)/2;rot.style.display=h>w*1.05?'flex':'none';}
addEventListener('resize',resize);addEventListener('orientationchange',resize);resize();

// ---------- storage ----------
const store={get(){try{return JSON.parse(localStorage.getItem('atletik_best')||'{}')}catch(e){return{}}},set(o){try{localStorage.setItem('atletik_best',JSON.stringify(o))}catch(e){}}};
const fmt=(v,d=2)=>v.toFixed(d).replace('.',',');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=x=>1-Math.pow(1-x,3);
const backOut=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
function box(x,y,w,h,r,fill,sw=4,shadow=0){if(shadow){ctx.fillStyle=OUT;rr(x,y+shadow,w,h,r);ctx.fill();}ctx.fillStyle=fill;rr(x,y,w,h,r);ctx.fill();if(sw){ctx.strokeStyle=OUT;ctx.lineWidth=sw;ctx.lineJoin='round';rr(x,y,w,h,r);ctx.stroke();}}
function text(t,x,y,fs,col,align='center',weight=800){ctx.font=weight+' '+fs+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(t,x,y);}
function stext(t,x,y,fs,fill,sw,sc=1,rotA=0){ctx.save();ctx.translate(x,y);ctx.rotate(rotA);ctx.scale(sc,sc);ctx.font='900 '+fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=sw;ctx.strokeStyle=OUT;ctx.strokeText(t,0,0);ctx.fillStyle=fill;ctx.fillText(t,0,0);ctx.restore();}
let UI=[],downBtn=null;
function button(id,x,y,w,h,label,fill,col,fs,fn){UI.push({id,x,y,w,h,fn});const pr=downBtn&&downBtn.id===id;box(x,y+(pr?3:0),w,h,h/2,fill,4,pr?1:4);text(label,x+w/2,y+h/2+(pr?3:0)+1,fs,col);}
function chip(label,x,y,w,h,fill,col,fs){box(x,y,w,h,h/2,fill,4,4);text(label,x+w/2,y+h/2+1,fs,col);}
function star(cx,cy,r,fill){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*0.45:r;ctx.lineTo(cx+q*Math.cos(a),cy+q*Math.sin(a));}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke();}
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#fff';ctx.strokeStyle=OUT;ctx.lineWidth=4;[[0,0,34,16],[-20,-8,18,14],[14,-12,20,16]].forEach(e=>{ctx.beginPath();ctx.ellipse(e[0],e[1],e[2],e[3],0,0,7);ctx.fill();ctx.stroke();});ctx.beginPath();ctx.ellipse(0,0,31,13,0,0,7);ctx.fill();ctx.restore();}// ---------- animation helpers ----------
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const PI=Math.PI;
const PZ0={lean:3,bob:0,lock:0,sx:1,sy:1,hd:0,tw:1,rot:0,flip:1,hair:1.1,al:1,ha:0,face:'n',l:[0,0,0,0],a:[-.15,.1,.15,.4]};
function pz(o){const p=Object.assign({},PZ0,o||{});p.l=(o&&o.l)||PZ0.l;p.a=(o&&o.a)||PZ0.a;p.__p=1;return p;}
function mixP(A,B,t){const r={__p:1};for(const k in PZ0){const a=A[k],b=B[k];if(typeof a==='number')r[k]=a+(b-a)*t;else if(Array.isArray(a))r[k]=a.map((v,i)=>v+(b[i]-v)*t);else r[k]=t<.5?a:b;}return r;}
function anim(keys,s){s=clamp(s,keys[0][0],keys[keys.length-1][0]);
  for(let i=0;i<keys.length-1;i++){const t0=keys[i][0],t1=keys[i+1][0];if(s<=t1){const u=t1>t0?(s-t0)/(t1-t0):1;return mixP(pz(keys[i][1]),pz(keys[i+1][1]),u*u*(3-2*u));}}
  return pz(keys[keys.length-1][1]);}

// ---------- particles ----------
let parts=[],shake=0;
function addP(o){parts.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,life:.6,age:0,c:'#fff',r:3,rot:Math.random()*6,vr:6,sh:'r',grow:0,drag:0},o));}
function burst(x,y,n,cols,vx,vy,g,life){for(let i=0;i<n;i++)addP({x,y,vx:(Math.random()-.5)*vx,vy:-Math.random()*vy,g,life:life*(0.6+Math.random()*0.6),c:cols[i%cols.length],r:2+Math.random()*3});}
function puff(x,y,n,col,spd,r){for(let i=0;i<n;i++)addP({x:x+(Math.random()-.5)*8,y:y-Math.random()*4,vx:(Math.random()-.8)*(spd||40),vy:-10-Math.random()*22,g:-8,life:.45+Math.random()*.3,c:col||'#fff',r:(r||5)*(.7+Math.random()*.6),sh:'puff',grow:1.6,drag:2.5});}
function splash(x,y,n,pw){for(let i=0;i<n;i++)addP({x:x+(Math.random()-.5)*10,y,vx:(Math.random()-.5)*90*(pw||1),vy:-(70+Math.random()*130)*(pw||1),g:520,life:.55+Math.random()*.3,c:i%3?'#fff':'#bfeeff',r:2+Math.random()*2.4,sh:'circ',vr:0});}
function sparkle(x,y,n,cols){for(let i=0;i<n;i++){const a=Math.random()*6.3,s=40+Math.random()*120;addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:200,life:.5+Math.random()*.4,c:cols[i%cols.length],r:3+Math.random()*3,sh:'star',vr:5,drag:2});}}
function updateParts(dt){for(const p of parts){p.age+=dt;p.vy+=p.g*dt;if(p.drag){const k=Math.exp(-p.drag*dt);p.vx*=k;p.vy*=k;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}parts=parts.filter(p=>p.age<p.life);}
function drawParts(){for(const p of parts){const u=p.age/p.life;ctx.save();ctx.translate(p.x,p.y);
  if(p.sh==='puff'){ctx.globalAlpha=Math.max(0,(1-u)*.75);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(0,0,p.r*(1+p.grow*u),0,7);ctx.fill();}
  else if(p.sh==='circ'){ctx.globalAlpha=Math.max(0,1-u*u);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fill();}
  else if(p.sh==='star'){ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,1-u);ctx.fillStyle=p.c;ctx.beginPath();for(let i=0;i<8;i++){const q=i%2?p.r*.35:p.r;ctx.lineTo(q*Math.cos(i*PI/4),q*Math.sin(i*PI/4));}ctx.closePath();ctx.fill();}
  else{ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);}
  ctx.restore();}}
function confetti(){const cols=['#ffd93d','#ff6b9d','#6bd6ff','#fff','#7ddc6b'];for(let i=0;i<90;i++)addP({x:Math.random()*W,y:-20-Math.random()*200,vx:(Math.random()-.5)*60,vy:60+Math.random()*120,g:0,life:5,c:cols[i%5],r:4+Math.random()*3});}

// ---------- crowd, stands, backgrounds ----------
const SKINS=['#ffd2a8','#f1b58a','#c68642','#8d5524','#ffe0bd'],SHIRTC=['#ff6b9d','#ffd93d','#4dabf7','#7ddc6b','#ff9e4a','#b197fc','#fff','#ff5252'],HAIRC=['#2b2140','#5b3a29','#e8590c','#ffd93d','#868e96','#c92a2a'];
let EXC=.2,excT=.2;
function crowdEx(v){excT=v;}
function spectator(x,y,id,t,ex){
  const r1=rnd(id),r2=rnd(id+7),r3=rnd(id+13),r4=rnd(id+29);
  const ph=t*(5+r1*3)+id*1.7,jmp=Math.max(0,Math.sin(ph))*(ex>.35?1+ex*8:1.2);
  const yy=y-jmp,sk=SKINS[(r2*5)|0],sh=SHIRTC[(r3*8)|0],hr=HAIRC[(r4*6)|0];
  ctx.lineCap='round';ctx.lineJoin='round';
  if(ex>.4||r1>.9){ctx.strokeStyle=sk;ctx.lineWidth=3.6;const w=Math.sin(ph*1.4)*4;ctx.beginPath();ctx.moveTo(x-6,yy+5);ctx.lineTo(x-10,yy-9+w);ctx.moveTo(x+6,yy+5);ctx.lineTo(x+10,yy-9-w);ctx.stroke();}
  if(r1>.86){const fx=x+10,fy=yy-9-Math.sin(ph*1.4)*4;ctx.strokeStyle=OUT;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(fx,fy+6);ctx.lineTo(fx,fy-12);ctx.stroke();ctx.fillStyle=SHIRTC[(r3*8+3|0)%8];ctx.beginPath();ctx.moveTo(fx,fy-12);ctx.lineTo(fx+11+Math.sin(t*6+id)*2,fy-8);ctx.lineTo(fx,fy-4);ctx.closePath();ctx.fill();ctx.lineWidth=1.8;ctx.stroke();}
  ctx.fillStyle=sh;ctx.strokeStyle=OUT;ctx.lineWidth=2.4;rr(x-7,yy,14,14,5);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(x,yy-5,7,0,7);ctx.fillStyle=sk;ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(x,yy-6,7,PI*1.02,PI*1.98);ctx.fillStyle=hr;ctx.fill();ctx.lineWidth=1.8;ctx.stroke();
  if(ex>.5){ctx.fillStyle=OUT;ctx.beginPath();ctx.arc(x+1,yy-4,2.2,0,PI);ctx.fill();}
}
const ADS=[['ATLETIK','#ff6b9d','#fff'],['HEJ HEJ!','#4dabf7','#fff'],['SPILLEHAL','#ffd93d',OUT],['GO GO GO','#7ddc6b',OUT],['MÅL!','#ff9e4a','#fff']];
function adBoards(camPx){const bw=150,n=ADS.length;const base=Math.floor(camPx/bw),off=camPx-base*bw;
  for(let i=-1;i<7;i++){const x=i*bw-off,a=ADS[(((base+i)%n)+n)%n];box(x,150,bw-4,21,5,a[1],3,0);text(a[0],x+bw/2-2,161,13,a[2]);}
  ctx.fillStyle='rgba(43,33,64,.25)';ctx.fillRect(0,171,W,3);}
function stands(camPx,t,ex){
  const g=ctx.createLinearGradient(0,52,0,150);g.addColorStop(0,'#7260bd');g.addColorStop(1,'#46397f');ctx.fillStyle=g;ctx.fillRect(0,52,W,98);
  ctx.strokeStyle='rgba(43,33,64,.32)';ctx.lineWidth=2;for(const y of [98,114,130,146]){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const par=camPx*.25,cs=24;
  [[80,0],[96,12],[112,0],[128,12]].forEach((r,ri)=>{const i0=Math.floor((par-30)/cs);for(let i=i0;i<i0+W/cs+3;i++){const x=i*cs+r[1]-par;if(x<-16||x>W+16)continue;spectator(x,r[0],i*4+ri,t,ex);}});
  ctx.fillStyle='rgba(70,57,127,.16)';ctx.fillRect(0,52,W,98);ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.strokeRect(-2,52,W+4,98);
  // roof cap + pennants
  ctx.fillStyle='#2b2140';ctx.fillRect(0,40,W,12);
  for(let x=-10;x<W+30;x+=26){const c=SHIRTC[(Math.floor((x+camPx*.25)/26)%8+8)%8],sw=Math.sin(t*3+x*.2)*2;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,52);ctx.lineTo(x+22,52);ctx.lineTo(x+11+sw,68);ctx.closePath();ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=OUT;ctx.stroke();}
}
function lightTower(x,camPx){const px=x-camPx*.1;ctx.fillStyle='#6a5f95';ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.fillRect(px-3,20,6,60);ctx.strokeRect(px-3,20,6,60);box(px-20,6,40,20,4,'#fff6c9',3,0);ctx.fillStyle='#ffe066';for(let i=0;i<3;i++)for(let j=0;j<2;j++){ctx.beginPath();ctx.arc(px-12+i*12,12+j*8,3.4,0,7);ctx.fill();}}
function skyDay(camPx){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5cc8ff');g.addColorStop(.5,'#a9e8ff');g.addColorStop(1,'#e6fbff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sg=ctx.createRadialGradient(740,40,4,740,40,90);sg.addColorStop(0,'rgba(255,244,170,.95)');sg.addColorStop(1,'rgba(255,244,170,0)');ctx.fillStyle=sg;ctx.fillRect(560,0,284,160);
  ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(740,40,22,0,7);ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.stroke();
  clouds(camPx);}
function stadiumBG(camPx,bounce){ // sky+stands+boards (y<171)
  excT=excT;skyDay(camPx);lightTower(120,camPx);lightTower(690,camPx);stands(camPx,tNow,EXC);adBoards(camPx);}
function trackTex(camPx){const p=ctx.createPattern(trackC,'repeat');ctx.save();ctx.translate(-((camPx)%32),0);ctx.fillStyle=p;ctx.fillRect(0,192,W+64,164);ctx.restore();}
const trackC=document.createElement('canvas');trackC.width=trackC.height=32;
{const g=trackC.getContext('2d');g.fillStyle='rgba(120,30,10,.13)';[[4,6,2],[20,3,1.6],[12,18,2.2],[27,24,1.8],[6,28,1.5],[24,12,1.4]].forEach(d=>{g.beginPath();g.arc(d[0],d[1],d[2],0,7);g.fill();});g.fillStyle='rgba(255,255,255,.07)';[[10,10,1.6],[26,18,1.4],[16,27,1.6]].forEach(d=>{g.beginPath();g.arc(d[0],d[1],d[2],0,7);g.fill();});}
function trackGround(camPx){
  // infield strip
  const gs=ctx.createLinearGradient(0,171,0,192);gs.addColorStop(0,'#5cc24d');gs.addColorStop(1,'#86e374');ctx.fillStyle=gs;ctx.fillRect(0,171,W,21);
  ctx.fillStyle='#fff';ctx.fillRect(0,186,W,6);ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.strokeRect(-2,171,W+4,21);
  // track
  const tg=ctx.createLinearGradient(0,192,0,356);tg.addColorStop(0,'#ff9a52');tg.addColorStop(1,'#f0743d');ctx.fillStyle=tg;ctx.fillRect(0,192,W,164);trackTex(camPx);
  ctx.fillStyle='rgba(255,255,255,.95)';for(const y of [246,300]){ctx.fillRect(0,y-2,W,5);}
  ctx.fillStyle='rgba(43,33,64,.16)';for(const y of [246,300]){ctx.fillRect(0,y+3,W,2);}
  ctx.fillStyle='#fff';ctx.fillRect(0,192,W,3);ctx.fillRect(0,353,W,3);ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.strokeRect(-2,192,W+4,164);
  // foreground
  const fg=ctx.createLinearGradient(0,356,0,H);fg.addColorStop(0,'#7260bd');fg.addColorStop(1,'#46397f');ctx.fillStyle=fg;ctx.fillRect(0,356,W,H-356);ctx.strokeRect(-2,356,W+4,H-356);}
function grassStripes(y0,y1,camPx,c1,c2){const w=64;const base=Math.floor(camPx/w);ctx.fillStyle=c1;ctx.fillRect(0,y0,W,y1-y0);ctx.fillStyle=c2;for(let i=-1;i<W/w+2;i++){if(((base+i)%2+2)%2)continue;ctx.fillRect(i*w-(camPx-base*w),y0,w,y1-y0);}}
function hills(camPx,par,baseY,amp,col,seed){ctx.beginPath();ctx.moveTo(-20,H);for(let x=-20;x<=W+20;x+=12){const wx=x+camPx*par;ctx.lineTo(x,baseY-amp*(.55*Math.sin(wx*.006+seed)+.3*Math.sin(wx*.013+seed*2.1)+.15*Math.sin(wx*.031+seed*.7)));}ctx.lineTo(W+20,H);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke();}
function tree(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#a0724a';ctx.strokeStyle=OUT;ctx.lineWidth=4;rr(-5,-22,10,24,3);ctx.fill();ctx.stroke();ctx.fillStyle='#4fb04a';[[0,-46,22],[-14,-32,15],[14,-32,15]].forEach(c=>{ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,7);ctx.fill();ctx.stroke();});ctx.fillStyle='#4fb04a';ctx.beginPath();ctx.arc(0,-44,19,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(-7,-52,8,0,7);ctx.fill();ctx.restore();}
function fieldBG(camPx,gy){ // open field with hills & trees; gy = ground horizon
  skyDay(camPx*.5);
  hills(camPx,.05,236,50,'#bff0b5',1.3);hills(camPx,.12,262,40,'#a8e6a1',4.1);
  for(let i=0;i<9;i++){const x=((i*170+60-camPx*.2)%1530+1530)%1530-120;tree(x,268+rnd(i)*10,.55+rnd(i+3)*.25);}
  grassStripes(gy,H,camPx,'#7ddc6b','#72d261');
  const sh=ctx.createLinearGradient(0,gy,0,gy+26);sh.addColorStop(0,'rgba(43,33,64,.22)');sh.addColorStop(1,'rgba(43,33,64,0)');ctx.fillStyle=sh;ctx.fillRect(0,gy,W,26);
  ctx.strokeStyle=OUT;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-5,gy);ctx.lineTo(W+5,gy);ctx.stroke();}
function windsock(x,y,t){ctx.strokeStyle=OUT;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-70);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  for(let i=0;i<4;i++){const px=x+4+i*11,py=y-68+Math.sin(t*4+i*.9)*2+i*.8,h=11-i*2;ctx.fillStyle=i%2?'#fff':'#ff6b9d';ctx.fillRect(px,py,11,h);ctx.strokeStyle=OUT;ctx.lineWidth=2;ctx.strokeRect(px,py,11,h);}}
function vignette(){const g=ctx.createRadialGradient(W/2,H/2,H*.55,W/2,H/2,W*.62);g.addColorStop(0,'rgba(43,33,64,0)');g.addColorStop(1,'rgba(43,33,64,.22)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function clouds(camPx){for(const cx of [150,520,800]){const x=(((cx-camPx*0.08+tNow*3)%1000)+1000)%1000-100;cloud(x,64,0.9);}}

// ---------- chibi rig ----------
const SK='#ffd2a8',SKF='#efb384';
function limb(p,col,w){ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.strokeStyle=OUT;ctx.lineWidth=w+5;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();}
const legP=(hx,a,b)=>{const kx=hx+11*Math.sin(a),ky=-22+11*Math.cos(a);return[[hx,-22],[kx,ky],[kx+11*Math.sin(b),ky+11*Math.cos(b)]];};
const armP=(sx,a,b,al)=>{const ex=sx+9*al*Math.sin(a),ey=-38+9*al*Math.cos(a);return[[sx,-38],[ex,ey],[ex+8*al*Math.sin(b),ey+8*al*Math.cos(b)]];};
function armIK(sx,tx,ty,al,dir){const L1=9*al,L2=8*al,dx=tx-sx,dy=ty+38,d=Math.hypot(dx,dy),dd=clamp(d,Math.abs(L1-L2)+.1,L1+L2-.05),base=Math.atan2(dy,dx),c=(L1*L1+dd*dd-L2*L2)/(2*L1*dd),a=Math.acos(clamp(c,-1,1))*(dir||1);
