<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6fd3ff">

<title>Atletik</title>
<style>
html,body{margin:0;height:100%;background:#1b1530;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:absolute;left:0;top:0}
#rot{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:rgba(27,21,48,.94);color:#fff;font:800 22px "Trebuchet MS",Arial,sans-serif;text-align:center;gap:14px;z-index:5}
#rot b{font-size:56px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot"><b>↻</b>Vend telefonen på langs</div>
<script>
(()=>{
'use strict';
const VERSION='0.2';
const HALL_URL='https://seranodk.github.io/';
const W=844,H=390,OUT='#2b2140';
const FONT='"Arial Rounded MT Bold","Trebuchet MS","DejaVu Sans",Arial,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),rot=document.getElementById('rot');
let SC=1,OX=0,OY=0,DPR=1;
function resize(){const w=innerWidth,h=innerHeight;DPR=Math.min(devicePixelRatio||1,2.5);cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';SC=Math.min(w/W,h/H);OX=(w-W*SC)/2;OY=(h-H*SC)/2;rot.style.display=h>w*1.05?'flex':'none';}
addEventListener('resize',resize);addEventListener('orientationchange',resize);resize();

// ---------- storage ----------
const store={get(){try{return JSON.parse(localStorage.getItem('atletik_best')||'{}')}catch(e){return{}}},set(o){try{localStorage.setItem('atletik_best',JSON.stringify(o))}catch(e){}}};
const fmt=(v,d=2)=>v.toFixed(d).replace('.',',');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=x=>1-Math.pow(1-x,3);
const backOut=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
function box(x,y,w,h,r,fill,sw=4,shadow=0){if(shadow){ctx.fillStyle=OUT;rr(x,y+shadow,w,h,r);ctx.fill();}ctx.fillStyle=fill;rr(x,y,w,h,r);ctx.fill();if(sw){ctx.strokeStyle=OUT;ctx.lineWidth=sw;ctx.lineJoin='round';rr(x,y,w,h,r);ctx.stroke();}}
function text(t,x,y,fs,col,align='center',weight=800){ctx.font=weight+' '+fs+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(t,x,y);}
function stext(t,x,y,fs,fill,sw,sc=1,rotA=0){ctx.save();ctx.translate(x,y);ctx.rotate(rotA);ctx.scale(sc,sc);ctx.font='900 '+fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=sw;ctx.strokeStyle=OUT;ctx.strokeText(t,0,0);ctx.fillStyle=fill;ctx.fillText(t,0,0);ctx.restore();}
let UI=[],downBtn=null;
function button(id,x,y,w,h,label,fill,col,fs,fn){UI.push({id,x,y,w,h,fn});const pr=downBtn&&downBtn.id===id;box(x,y+(pr?3:0),w,h,h/2,fill,4,pr?1:4);text(label,x+w/2,y+h/2+(pr?3:0)+1,fs,col);}
function chip(label,x,y,w,h,fill,col,fs){box(x,y,w,h,h/2,fill,4,4);text(label,x+w/2,y+h/2+1,fs,col);}
function star(cx,cy,r,fill){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*0.45:r;ctx.lineTo(cx+q*Math.cos(a),cy+q*Math.sin(a));}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke();}
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#fff';ctx.strokeStyle=OUT;ctx.lineWidth=4;[[0,0,34,16],[-20,-8,18,14],[14,-12,20,16]].forEach(e=>{ctx.beginPath();ctx.ellipse(e[0],e[1],e[2],e[3],0,0,7);ctx.fill();ctx.stroke();});ctx.beginPath();ctx.ellipse(0,0,31,13,0,0,7);ctx.fill();ctx.restore();}
// crowd pattern
const crowdC=document.createElement('canvas');crowdC.width=crowdC.height=14;
{const g=crowdC.getContext('2d');g.fillStyle='#8c7bd1';g.fillRect(0,0,14,14);[[4,4,3,'#ff6b9d'],[11,9,3,'#ffd93d'],[3,11,2.5,'#fff'],[10,2,2.5,'#6bd6ff']].forEach(c=>{g.fillStyle=c[3];g.beginPath();g.arc(c[0],c[1],c[2],0,7);g.fill();});}
const crowdPat=ctx.createPattern(crowdC,'repeat');
function crowd(camPx,bounce){ctx.save();ctx.translate(-((camPx*0.25)%14),bounce);ctx.fillStyle=crowdPat;ctx.fillRect(-14,100-bounce,W+28,70);ctx.restore();ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.strokeRect(-2,100,W+4,70);}
function sky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6fd3ff');g.addColorStop(1,'#d6f6ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function clouds(camPx){for(const cx of [150,560,800]){const x=(((cx-camPx*0.08)%1000)+1000)%1000-100;cloud(x,66,0.9);}}

// ---------- chibi ----------
function limb(p,col,w){ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.strokeStyle=OUT;ctx.lineWidth=w+5;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();}
const legP=(hx,a,b)=>{const kx=hx+11*Math.sin(a),ky=-22+11*Math.cos(a);return[[hx,-22],[kx,ky],[kx+11*Math.sin(b),ky+11*Math.cos(b)]];};
const armP=(sx,a,b)=>{const ex=sx+9*Math.sin(a),ey=-38+9*Math.cos(a);return[[sx,-38],[ex,ey],[ex+8*Math.sin(b),ey+8*Math.cos(b)]];};
function runLeg(hx,psi){const a=0.85*Math.sin(psi),bend=0.95*Math.max(0,-Math.cos(psi));return legP(hx,a,a-bend);}
function runArm(sx,psi){const a=-0.9*Math.sin(psi);return armP(sx,a,a+1.25);}
const LOOKS=[{shirt:'#ff6b9d',hair:'#5b3a29',band:'#fff'},{shirt:'#4dabf7',hair:'#e8590c',band:'#fff'},{shirt:'#ffd93d',hair:'#2b2140',band:'#ff6b9d'}];
// pose: {kind:'run'|'crouch'|'idle'|'jump'|'throw'|'cheer'|'sad', ph, k, spear (angle rad or null)}
function chibi(x,y,s,look,pose){
  const kind=pose.kind,ph=pose.ph||0;
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,(pose.gy!=null?pose.gy:y)+1,22*s,4*s,0,0,7);ctx.fill();
  ctx.save();
  let bob=0,lean=3;
  let L1,L2,A1,A2;
  if(kind==='run'){bob=-2.5*Math.abs(Math.sin(ph));lean=5;L1=runLeg(-2,ph);L2=runLeg(3,ph+Math.PI);A1=runArm(-6,ph+Math.PI);A2=runArm(9,ph);}
  else if(kind==='crouch'){lean=12;L1=runLeg(-2,0.9);L2=runLeg(3,-0.5);A1=armP(-6,1.2,1.2);A2=armP(9,-0.5,0.4);}
  else if(kind==='jump'){lean=-4;L1=legP(-2,1.25,0.55);L2=legP(3,0.45,-0.25);A1=armP(-6,-2.3,-1.9);A2=armP(9,2.6,3.0);}
  else if(kind==='throw'){const k=pose.k||0;lean=lerp(-6,10,k);L1=legP(-2,lerp(0.5,0.7,k),lerp(0.35,0.6,k));L2=legP(3,lerp(-0.7,0.2,k),lerp(-1.0,0.1,k));
    const a=lerp(-2.0,2.5,easeOut(k));A1=armP(-6,0.4,0.9);A2=armP(9,a,a+0.35);}
  else if(kind==='cheer'){bob=-3*Math.abs(Math.sin(ph));L1=legP(-3,-0.1,-0.1);L2=legP(4,0.1,0.1);A1=armP(-6,-2.7,-3.0);A2=armP(9,2.7,3.0);}
  else if(kind==='sad'){lean=-2;L1=legP(-3,0,0);L2=legP(4,0,0);A1=armP(-6,-0.2,-0.1);A2=armP(9,0.2,0.1);}
  else{L1=legP(-3,0,0);L2=legP(4,0,0);A1=armP(-6,-0.15,0.1);A2=armP(9,0.15,0.4);}
  ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(lean*Math.PI/180);ctx.translate(0,bob);
  limb(L1,'#ffd2a8',7);limb(L2,'#ffd2a8',7);
  [L1,L2].forEach(L=>{const f=L[2];ctx.fillStyle='#fff';ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(f[0]+3,f[1]+1,7,4,0,0,7);ctx.fill();ctx.stroke();});
  limb(A1,'#ffd2a8',6);
  box(-11,-45,23,25,9,look.shirt,4);box(-11,-27,23,8,3,'#3b2f63',3);
  limb(A2,'#ffd2a8',6);
  if(pose.spear!=null){const h=A2[2],u=[Math.cos(pose.spear),-Math.sin(pose.spear)];ctx.lineCap='round';ctx.beginPath();ctx.moveTo(h[0]-u[0]*26,h[1]-u[1]*26);ctx.lineTo(h[0]+u[0]*52,h[1]+u[1]*52);ctx.strokeStyle=OUT;ctx.lineWidth=8;ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3.5;ctx.stroke();
    ctx.beginPath();ctx.moveTo(h[0]+u[0]*50-u[1]*5,h[1]+u[1]*50+u[0]*5);ctx.lineTo(h[0]+u[0]*66,h[1]+u[1]*66);ctx.lineTo(h[0]+u[0]*50+u[1]*5,h[1]+u[1]*50-u[0]*5);ctx.closePath();ctx.fillStyle='#ffd93d';ctx.fill();ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();}
  ctx.beginPath();ctx.arc(3,-66,22,0,7);ctx.fillStyle='#ffd2a8';ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-18,-66);ctx.arc(3.5,-67,21.5,Math.PI,2*Math.PI);ctx.quadraticCurveTo(14,-80,0,-73);ctx.quadraticCurveTo(-10,-70,-18,-66);ctx.closePath();ctx.fillStyle=look.hair;ctx.fill();ctx.lineWidth=3.5;ctx.stroke();
  if(look.band){ctx.beginPath();ctx.moveTo(-18,-68);ctx.quadraticCurveTo(3,-60,25,-70);ctx.strokeStyle=look.band;ctx.lineWidth=6;ctx.stroke();}
  ctx.fillStyle='#ff8fab';ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(9,-56,4,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle=OUT;ctx.lineWidth=2.6;ctx.lineCap='round';
  if(kind==='cheer'){ctx.beginPath();ctx.arc(15,-64,3.2,Math.PI*1.1,Math.PI*1.9);ctx.stroke();ctx.fillStyle='#7a1f3d';ctx.beginPath();ctx.ellipse(17,-52,5,4,0,0,Math.PI);ctx.fill();ctx.stroke();}
  else{ctx.fillStyle=OUT;ctx.beginPath();ctx.arc(14,-64,3.6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(15,-65,1.2,0,7);ctx.fill();
    ctx.beginPath();if(kind==='sad'){ctx.moveTo(12,-50);ctx.quadraticCurveTo(17,-54,22,-50);}else{ctx.moveTo(12,-53);ctx.quadraticCurveTo(17,-49,22,-54);}ctx.stroke();}
  ctx.restore();
}

// ---------- particles ----------
let parts=[];
function burst(x,y,n,cols,vx,vy,g,life){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*vx,vy:-Math.random()*vy,g,life:life*(0.6+Math.random()*0.6),age:0,c:cols[i%cols.length],r:2+Math.random()*3,rot:Math.random()*6});}
function updateParts(dt){for(const p of parts){p.age+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*6;}parts=parts.filter(p=>p.age<p.life);}
function drawParts(){for(const p of parts){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);ctx.restore();}}
function confetti(){const cols=['#ffd93d','#ff6b9d','#6bd6ff','#fff','#7ddc6b'];for(let i=0;i<90;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*200,vx:(Math.random()-.5)*60,vy:60+Math.random()*120,g:0,life:5,age:0,c:cols[i%5],r:4+Math.random()*3,rot:Math.random()*6});}

// ---------- input ----------
let scene=null,tNow=0,flash={l:-9,r:-9};
function go(s,arg){scene=s;parts=[];s.enter(arg);}
function toLogical(e){return{x:(e.clientX-OX)/SC,y:(e.clientY-OY)/SC};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=toLogical(e);for(let i=UI.length-1;i>=0;i--){const b=UI[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){downBtn=b;b.fn();return;}}
  scene.tap&&scene.tap(p.x,p.y,p.x<W/2?'l':'r');},{passive:false});
addEventListener('pointerup',()=>{downBtn=null;});addEventListener('pointercancel',()=>{downBtn=null;});
addEventListener('keydown',e=>{if(e.repeat)return;const c=e.code;if(c==='ArrowLeft'||c==='KeyA'||c==='KeyZ')scene.tap&&scene.tap(100,300,'l');else if(c==='ArrowRight'||c==='KeyD'||c==='KeyX'||c==='Slash')scene.tap&&scene.tap(700,300,'r');else if(c==='Space'||c==='Enter'){e.preventDefault();scene.act&&scene.act();}else if(c==='Escape')go(Menu);});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

// ---------- shared HUD ----------
let HUDW=104;
function hudTop(left,center,right,centerFill){
  ctx.font='800 16px '+FONT;HUDW=Math.max(104,ctx.measureText(left).width+34);chip(left,12,10,HUDW,38,'#fff',OUT,16);
  if(center!=null)chip(center,344,8,156,44,centerFill||'#ffd93d',OUT,24);
  if(right)chip(right,716,10,116,38,'#fff',OUT,14);
}
function menuBtn(){button('menu',HUDW+20,10,86,38,'‹ Menu','#fff',OUT,14,()=>go(Menu));}
function bigMsg(msg,tt){if(!msg)return;const p=clamp(tt/0.3,0,1),fs=msg.length>6?56:78;stext(msg,422,150+fs/2,fs,'#ffd93d',12,0.4+0.6*backOut(p));}
function resultCard(r,tt){ // r:{title,line,stars,record,btns}
  const p=clamp(tt/0.5,0,1),off=(1-backOut(p))*320;ctx.save();ctx.translate(0,off);
  box(222,58,400,276,30,'#fff',5,6);stext(r.title,422,112,50,'#ff6b9d',10);text(r.line,422,160,24,OUT);if(r.sub)text(r.sub,422,188,15,'#6b5f8f');
  for(let k=0;k<3;k++){const sp=clamp((tt-0.5-k*0.3)/0.3,0,1),cx=422+(k-1)*74;if(k<r.stars&&sp>0){ctx.save();ctx.translate(cx,236);ctx.scale(backOut(sp),backOut(sp));ctx.translate(-cx,-236);star(cx,236,30,'#ffd93d');ctx.restore();}else{ctx.save();ctx.globalAlpha=.25;star(cx,236,30,'#9a8fc0');ctx.restore();}}
  if(r.record&&tt>1){ctx.save();ctx.translate(574,84);ctx.rotate(0.25);box(-50,-16,100,32,16,'#7ddc6b',3);text('Ny rekord!',0,1,14,OUT);ctx.restore();}
  button('again',246,276,170,44,'Igen','#ff6b9d','#fff',20,r.again);button('tomenu',428,276,170,44,'Menu','#4dabf7','#fff',20,()=>go(Menu));
  ctx.restore();
}

const K=16;
// ================= registry & shared =================
function saveBest(key,val,low){const b=store.get();const old=b[key];const rec=old==null||(low?val<old:val>old);if(rec){b[key]=val;store.set(b);}return rec;}
function fmtVal(e,v){return v==null?'–':e.unit==='point'?v+' point':e.unit==='s'?fmt(v)+' s':fmt(v,e.dec)+' m';}
const EV=[
 {key:'m100',name:'100 m',desc:'Tryk hurtigt',low:true,unit:'s',dec:2,go:()=>go(Race,RUN),icon:'run'},
 {key:'swim',name:'Svømning',desc:'Tryk hurtigt',low:true,unit:'s',dec:2,go:()=>go(Race,SWIM),icon:'swim'},
 {key:'hurdles',name:'Hækkeløb',desc:'Tryk for at hoppe',low:true,unit:'s',dec:2,go:()=>go(Hurdles),icon:'hurdle'},
 {key:'lj',name:'Længdespring',desc:'Løb og hop',unit:'m',dec:2,go:()=>go(LongJump),icon:'lj'},
 {key:'hj',name:'Højdespring',desc:'Ram timingen',unit:'m',dec:2,go:()=>go(HighJump),icon:'hj'},
 {key:'jav',name:'Spydkast',desc:'Løb og kast',unit:'m',dec:1,go:()=>go(Javelin),icon:'jav'},
 {key:'shot',name:'Kuglestød',desc:'Stop bjælken',unit:'m',dec:2,go:()=>go(MeterThrow,SHOT),icon:'shot'},
 {key:'disc',name:'Diskoskast',desc:'Stop bjælken',unit:'m',dec:1,go:()=>go(MeterThrow,DISC),icon:'disc'},
 {key:'arch',name:'Bueskydning',desc:'Ram midten',unit:'point',dec:0,go:()=>go(Archery),icon:'arch'}];
const EVK={};EV.forEach(e=>EVK[e.key]=e);
function runButtons(){const lh=tNow-flash.l<0.1,rh=tNow-flash.r<0.1;box(16,346,230,40,20,lh?'#1971c2':'#4dabf7',4,4);text('Venstre',131,366,15,'#fff');box(598,346,230,40,20,rh?'#c2255c':'#ff6b9d',4,4);text('Højre',713,366,15,'#fff');}
function runTap(self,side){if(side==='l')flash.l=tNow;else flash.r=tNow;if(self.last!==side)self.v+=0.55;else self.v=Math.max(0,self.v-0.25);self.last=side;}
function timingQ(gap,auto){return auto?0.7:gap<=3?1-gap*0.03:Math.max(0.4,0.9-(gap-3)*0.06);}
function zoneStripe(x0,x1,y0,h){const pulse=0.5+0.5*Math.sin(tNow*8);ctx.fillStyle='rgba(125,220,107,'+(0.45+0.2*pulse)+')';ctx.fillRect(x0,y0,x1-x0,h);ctx.strokeStyle='#2b8a3e';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.strokeRect(x0,y0,x1-x0,h);ctx.setLineDash([]);}
function finishAttempts(self,e,best,thr){const rec=best>0&&saveBest(e.key,best,false);const b=store.get()[e.key];const st=best>=thr[0]?3:best>=thr[1]?2:best>=thr[2]?1:0;
  self.res={title:'Bedste',line:best>0?fmtVal(e,+best.toFixed(e.dec)):'Ingen gyldige',sub:'Rekord: '+fmtVal(e,b),stars:st,record:rec,again:e.go};if(st>1)confetti();}
const cdMsg=t=>t<1.4?['På plads',t]:t<2.8?['Klar...',t-1.4]:t<3.6?['Start!',t-2.8]:[null,0];
function trackBG(dc,K,bounce){sky();clouds(dc*K);crowd(dc*K,bounce||0);ctx.fillStyle='#ff6b9d';ctx.fillRect(0,170,W,22);ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.strokeRect(-2,170,W+4,22);ctx.fillStyle='#ff9e4a';ctx.fillRect(0,192,W,164);ctx.strokeRect(-2,192,W+4,164);ctx.fillStyle='#fff';ctx.fillRect(0,246,W,5);ctx.fillRect(0,300,W,5);}
function finishLine(fx){for(let r=0;r<10;r++)for(let c=0;c<2;c++){ctx.fillStyle=(r+c)%2?'#fff':'#111';ctx.fillRect(fx+c*11,192+r*16.4,11,16.4);}ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.strokeRect(fx,192,22,164);}
function icon(k){ctx.strokeStyle=OUT;ctx.lineCap='round';ctx.lineJoin='round';
  const st=(col,w)=>{ctx.lineWidth=w+5;ctx.strokeStyle=OUT;ctx.stroke();ctx.lineWidth=w;ctx.strokeStyle=col;ctx.stroke();};
  if(k==='run'){[-14,0,14].forEach(y=>{ctx.beginPath();ctx.moveTo(-28,y);ctx.lineTo(14,y);st('#ff9e4a',4);});ctx.fillStyle='#ffd93d';ctx.beginPath();ctx.arc(26,0,8,0,7);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OUT;ctx.stroke();}
  if(k==='swim'){for(const y of [-6,10]){ctx.beginPath();ctx.moveTo(-30,y);for(let i=0;i<=6;i++)ctx.lineTo(-30+i*10,y+(i%2?5:-5));st('#4dabf7',4);}ctx.fillStyle='#ffd2a8';ctx.beginPath();ctx.arc(10,-16,9,0,7);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OUT;ctx.stroke();}

  finish(){const e=EVK.arch,rec=saveBest('arch',this.score,false);const st=this.score>=40?3:this.score>=28?2:this.score>=15?1:0;this.res={title:this.score+' point',line:'Af 60 mulige',sub:'Rekord: '+fmtVal(e,store.get().arch),stars:st,record:rec,again:()=>go(Archery)};if(st>1)confetti();},
  draw(){

    ctx.fillStyle='#a8e6a1';ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-20,250);ctx.quadraticCurveTo(120,170,300,236);ctx.quadraticCurveTo(450,290,620,226);ctx.quadraticCurveTo(760,180,880,246);ctx.lineTo(880,400);ctx.lineTo(-20,400);ctx.closePath();ctx.fill();ctx.stroke();

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;tNow=now/1000;
  scene.update(dt);
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#1b1530';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,OX*DPR,OY*DPR);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  UI=[];scene.draw();
  ctx.restore();
  requestAnimationFrame(frame);
}
window.__atletik={go:(n,a)=>go({Menu,Race,Hurdles,LongJump,HighJump,Javelin,MeterThrow,Archery}[n],a),RUN,SWIM,SHOT,DISC,get scene(){return scene;},tap:(s)=>scene.tap&&scene.tap(s==='l'?100:700,300,s),act:()=>scene.act&&scene.act()};
